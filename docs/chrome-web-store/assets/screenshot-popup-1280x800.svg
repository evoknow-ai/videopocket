<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#12080c"/><stop offset="1" stop-color="#3c1019"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-opacity=".45"/></filter></defs>
  <rect width="1280" height="800" fill="url(#bg)"/>
  <circle cx="1130" cy="70" r="310" fill="#e53935" opacity=".10"/>
  <image href="../../../extension/icons/128.png" x="74" y="69" width="88" height="88"/>
  <text x="74" y="218" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="58" font-weight="700">Save media.</text>
  <text x="74" y="284" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="58" font-weight="700">Keep it private.</text>
  <text x="76" y="340" fill="#eab8b7" font-family="Arial,Helvetica,sans-serif" font-size="25">X, Facebook, and Instagram</text>
  <g font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#fff">
    <text x="76" y="420">✓ Live download progress</text><text x="76" y="464">✓ Local Mac processing</text><text x="76" y="508">✓ Organized downloads</text>
  </g>
  <rect x="698" y="66" width="464" height="668" rx="32" fill="#090509" opacity=".55" filter="url(#shadow)"/>
  <image href="../../images/videopocket-extension-popup.png" x="730" y="93" width="400" height="390" preserveAspectRatio="xMidYMin meet"/>
  <text x="730" y="552" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700">One click to save</text>
  <text x="730" y="595" fill="#d8b8bd" font-family="Arial,Helvetica,sans-serif" font-size="19">Direct files download in Chrome.</text>
  <text x="730" y="625" fill="#d8b8bd" font-family="Arial,Helvetica,sans-serif" font-size="19">Complex streams are processed locally.</text>
  <text x="730" y="681" fill="#ef8d8a" font-family="Arial,Helvetica,sans-serif" font-size="17">Only save media you own or may download.</text>
